plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
}

def ENV = System.getenv()

archivesBaseName = 'profotoce59'
group = 'profotoce59'
version '1.0-SNAPSHOT'

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

allprojects {
    repositories {
        mavenCentral()
        maven{
            url "https://jitpack.io"
        }
        maven {
            url "https://nexus.seedfinding.com/repository/maven-seedfinding"
        }
        maven {
            url "https://nexus.seedfinding.com/repository/maven-seedfinding-snapshots"
        }
    }
}

application{
    mainClass = "profotoce59.Main"
}

dependencies {
    implementation('com.seedfinding:mc_math:1.171.0') { transitive = false }
    implementation('com.seedfinding:mc_seed:1.171.2') { transitive = false }
    implementation('com.seedfinding:mc_core:1.194.0') { transitive = false }
    implementation('com.seedfinding:mc_noise:1.171.1') { transitive = false }

    implementation('com.seedfinding:mc_biome:1.171.1') { transitive = false }
    implementation('com.seedfinding:mc_terrain:1.171.1') { transitive = false }
    implementation('com.seedfinding:mc_feature:1.171.5') { transitive = false }
    implementation('com.seedfinding:mc_reversal:1.171.1') { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}

// Tâche pour exécuter le test de comparaison
task runCompareTest(type: JavaExec) {
    group = 'verification'
    description = 'Exécute le test de comparaison Java/C'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'profotoce59.test.CompareSurfaceGenTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Tâche pour trouver une seed de village
task findVillageSeed(type: JavaExec) {
    group = 'application'
    description = 'Trouve une seed avec un village qui se génère correctement'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'profotoce59.test.FindVillageSeed'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Tâche pour comparer les pièces du village
task compareVillagePieces(type: JavaExec) {
    group = 'verification'
    description = 'Affiche toutes les pièces du village pour comparaison Java/C'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'profotoce59.properties.CompareVillagePieces'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Tâche pour vérifier la hauteur à une position donnée
task checkHeight(type: JavaExec) {
    group = 'verification'
    description = 'Vérifie la hauteur du terrain à une position donnée'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'profotoce59.test.CheckHeightAt'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Tâche pour comparer en détail les différentes méthodes de calcul de hauteur
task detailedHeightCheck(type: JavaExec) {
    group = 'verification'
    description = 'Compare les différentes méthodes de calcul de hauteur en Java'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'profotoce59.test.DetailedHeightCheck'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Tâche pour analyser le décalage de hauteur sur plusieurs seeds/positions
task heightOffsetAnalysis(type: JavaExec) {
    group = 'verification'
    description = 'Analyse le décalage de hauteur sur plusieurs seeds et positions'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'profotoce59.test.HeightOffsetAnalysis'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Tâche pour logger en détail le calcul de hauteur Java
task logHeightJava(type: JavaExec) {
    group = 'verification'
    description = 'Log détaillé du calcul de hauteur Java (génère java_height_log.txt)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'profotoce59.test.LogHeightCalculationJava'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Tâche pour tester SurfaceGenerator2 directement avec logs
task testSurfaceGen2(type: JavaExec) {
    group = 'verification'
    description = 'Test SurfaceGenerator2 directement avec logs détaillés'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'profotoce59.test.TestSurfaceGen2Direct'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// configure the maven publication
publishing {
    publications {
        maven(MavenPublication) {
            artifactId = archivesBaseName
            version = version
            groupId = group

            from components.java
        }
    }

    // select the repositories you want to publish to
    repositories {
        if (ENV.MAVEN_URL) {
            maven {
                url ENV.MAVEN_URL
                credentials {
                    username ENV.MAVEN_USERNAME
                    password ENV.MAVEN_PASSWORD
                }
            }
        }
    }
}
